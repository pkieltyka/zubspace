# One Zubspace environment (prod or dev) on the production host, run by
# rootless Podman as `peter`. `scripts/deploy.sh <env>` installs this file
# together with deploy/<env>/ into ~/zubspace/<env>/ and runs
#
#   podman compose --project-name zubspace-<env> \
#     --env-file compose.env --env-file release.env up -d
#
# compose.env holds this environment's ports and limits; release.env holds
# ZUBSPACE_TAG, the first 12 hex digits of the deployed commit. The game server
# reads everything else from zubspace_server.toml. The one host-only file is
# cloudflared.env (TUNNEL_TOKEN, mode 600, never committed).
#
# Every service uses host networking: the game server's UDP host candidates must
# be the host's public address, and the other listeners bind loopback only.

x-logging: &logging
  # The systemd journal caps total log storage for every container on the host
  # (deploy/host/journald.conf). `podman logs` and `journalctl --user` read it.
  driver: journald

services:
  server:
    image: localhost/zubspace/server:${ZUBSPACE_TAG:?ZUBSPACE_TAG is unset}
    pull_policy: never
    # podman-restart.service brings back only `always` containers after a boot.
    restart: always
    network_mode: host
    command: ["--config", "/etc/zubspace/zubspace_server.toml"]
    volumes:
      - ./zubspace_server.toml:/etc/zubspace/zubspace_server.toml:ro
      # Used when the config sets log_file (dev); rotated on the host by
      # deploy/host/logrotate.conf.
      - ./logs:/var/log/zubspace
    cpus: ${ZUBSPACE_SERVER_CPUS:?}
    cpu_shares: ${ZUBSPACE_SERVER_CPU_SHARES:?}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:${ZUBSPACE_SERVER_HTTP_PORT:?}/v1/status"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *logging

  client:
    image: localhost/zubspace/client:${ZUBSPACE_TAG:?ZUBSPACE_TAG is unset}
    pull_policy: never
    restart: always
    network_mode: host
    depends_on:
      server:
        condition: service_healthy
    environment:
      ZUBSPACE_SERVER_UPSTREAM: "127.0.0.1:${ZUBSPACE_SERVER_HTTP_PORT:?}"
      ZUBSPACE_CLIENT_LISTEN_ADDRESS: "127.0.0.1"
      ZUBSPACE_CLIENT_LISTEN_PORT: "${ZUBSPACE_CLIENT_PORT:?}"
      ZUBSPACE_ROBOTS_TAG: "${ZUBSPACE_ROBOTS_TAG:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${ZUBSPACE_CLIENT_PORT:?}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *logging

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.9.3
    restart: always
    network_mode: host
    env_file: cloudflared.env
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:${ZUBSPACE_TUNNEL_METRICS_PORT:?}", "run"]
    depends_on:
      client:
        condition: service_healthy
    logging: *logging

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    restart: always
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:${ZUBSPACE_PROMETHEUS_PORT:?}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    cpu_shares: 256
    logging: *logging

  # Host CPU, memory, disk and network for both environments. Only prod runs it
  # (COMPOSE_PROFILES=host in deploy/prod/compose.env); dev's Prometheus scrapes it too.
  node-exporter:
    profiles: ["host"]
    image: docker.io/prom/node-exporter:v1.12.1
    restart: always
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9180
    volumes:
      - /:/host:ro
    cpu_shares: 256
    logging: *logging

volumes:
  prometheus-data:
