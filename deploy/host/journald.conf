# Installed as /etc/systemd/journald.conf.d/zubspace.conf by deploy/host/setup.sh.
# Every container logs through the journald driver, so these limits bound all
# container logs (prod and dev, every service) together with the system's own.
[Journal]
Storage=persistent
# Total journal size on disk; the oldest entries are removed first.
SystemMaxUse=20G
# Always leave at least this much disk free, even below SystemMaxUse.
SystemKeepFree=20G
SystemMaxFileSize=1G
MaxRetentionSec=60day
