# Installed as /etc/logrotate.d/zubspace by deploy/host/setup.sh, which also
# makes logrotate.timer hourly. Covers the game server's file logs (dev writes
# server.log and client.log; prod logs to the journal instead). At most ten
# compressed generations of 500 MB each per file are kept.
/home/peter/zubspace/*/logs/*.log {
    size 500M
    rotate 10
    compress
    # The server keeps the file open; truncate it in place after copying.
    copytruncate
    missingok
    notifempty
}
